<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fascinante - Gerenciador de CSV</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1, h2 { color: #2c3e50; margin-top: 0; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fafafa; }
        .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        input, button { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input[type="text"] { flex: 1; min-width: 150px; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        button.btn-danger { background-color: #e74c3c; }
        button.btn-danger:hover { background-color: #c0392b; }
        button.btn-success { background-color: #2ecc71; }
        button.btn-success:hover { background-color: #27ae60; }
        .search-box { width: 100%; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #34495e; color: #fff; }
        tr:hover { background-color: #f1f1f1; }
        a { color: #3498db; text-decoration: none; font-weight: bold; }
        .actions-cell { display: flex; gap: 5px; }
        .loading-input { background-color: #f1f2f6; color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Repositório Fascinante</h1>

        <div class="section">
            <h2>🔑 Modo Editor (Configuração do GitHub)</h2>
            <div class="form-group">
                <input type="text" id="github-user" placeholder="Seu usuário do GitHub (ex: joaosilva)">
                <input type="password" id="github-token" placeholder="Cole seu Personal Access Token (PAT) aqui">
                <button onclick="saveConfig()">Ativar Modo Editor</button>
                <button class="btn-danger" onclick="clearConfig()">Deslogar</button>
            </div>
            <small style="color: #7f8c8d;">Seu token fica salvo localmente apenas no seu navegador.</small>
        </div>

        <div class="section" id="form-section" style="display:none;">
            <h2 id="form-title">➕ Adicionar Novo Registro</h2>
            <input type="hidden" id="edit-index">
            <div class="form-group">
                <input type="text" id="input-link" placeholder="Cole o Link do YouTube aqui (https://...)">
                <input type="text" id="input-assunto" placeholder="Assunto (Preenchido automaticamente)">
                <input type="text" id="input-texto" placeholder="Texto Complementar / Canal (Preenchido automaticamente)">
                <button class="btn-success" id="btn-save" onclick="saveRecord()">Adicionar</button>
                <button id="btn-cancel" style="display:none;" onclick="resetForm()">Cancelar</button>
            </div>
            <small id="youtube-status" style="color: #27ae60; display: none; font-weight: bold;"></small>
        </div>

        <input type="text" id="search" class="search-box" placeholder="🔎 Buscar por assunto ou texto complementar...">
        
        <div style="overflow-x:auto;">
            <table id="csv-table">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Assunto</th>
                        <th>Link</th>
                        <th>Texto Complementar</th>
                        <th class="admin-action" style="display:none;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="text-align: center;">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DO ARQUIVO
        const repoName = 'fascinante';
        const csvFileName = 'fascinante.csv'; 

        let csvDataGlobal = []; // Guarda os dados na memória

        // Carrega as configurações do LocalStorage (se existirem)
        document.getElementById('github-user').value = localStorage.getItem('git_user') || '';
        document.getElementById('github-token').value = localStorage.getItem('git_token') || '';

        // Executa ao abrir a página
        checkAdminMode();
        loadCSV();

        function saveConfig() {
            localStorage.setItem('git_user', document.getElementById('github-user').value.trim());
            localStorage.setItem('git_token', document.getElementById('github-token').value.trim());
            alert('Configurações salvas! Recarregando...');
            location.reload();
        }

        function clearConfig() {
            localStorage.clear();
            alert('Configurações removidas.');
            location.reload();
        }

        function checkAdminMode() {
            const token = localStorage.getItem('git_token');
            if (token) {
                document.getElementById('form-section').style.display = 'block';
            }
        }

        // Busca o CSV atualizado
        async function loadCSV() {
            try {
                const response = await fetch(`${csvFileName}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Erro ao ler CSV');
                const text = await response.text();
                parseCSV(text);
            } catch (error) {
                console.error(error);
                alert('Erro ao carregar o arquivo CSV público.');
            }
        }

        // Transforma o texto do CSV em Array de Objetos
        function parseCSV(text) {
            const rows = text.split('\n');
            csvDataGlobal = [];
            
            for (let i = 1; i < rows.length; i++) {
                const rowText = rows[i].trim();
                if (!rowText) continue;
                const cols = rowText.split(';');
                csvDataGlobal.push({
                    datahora: cols[0] || '',
                    assunto: cols[1] || '',
                    link: cols[2] || '',
                    texto: cols[3] || ''
                });
            }
            renderTable();
        }

        // Renderiza a tabela na tela
        function renderTable() {
            const tbody = document.querySelector('#csv-table tbody');
            tbody.innerHTML = '';
            const isAdmin = !!localStorage.getItem('git_token');

            if (isAdmin) {
                document.querySelectorAll('.admin-action').forEach(el => el.style.display = '');
            }

            csvDataGlobal.forEach((item, index) => {
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${formatDateTime(item.datahora)}</td>
                    <td>${item.assunto}</td>
                    <td>${item.link ? `<a href="${item.link}" target="_blank">Assistir ↗</a>` : '-'}</td>
                    <td style="font-style:italic; color:#7f8c8d;">${item.texto}</td>
                    ${isAdmin ? `
                        <td class="actions-cell">
                            <button onclick="editRow(${index})">✏️</button>
                            <button class="btn-danger" onclick="deleteRow(${index})">🗑️</button>
                        </td>
                    ` : ''}
                `;
                tbody.appendChild(tr);
            });
        }

        // ==========================================
        // INTEGRAÇÃO COM EXTRACTOR DO YOUTUBE
        // ==========================================

        function extractVideoId(url) {
            if (!url || typeof url !== 'string') return null;
            let cleanUrl = url.trim();
            const patterns = [
                /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|v\/|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/watch\?.*[?&]v=([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/v\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
            ];

            for (let pattern of patterns) {
                const match = cleanUrl.match(pattern);
                if (match && match[1]) return match[1];
            }

            const looseMatch = cleanUrl.match(/([a-zA-Z0-9_-]{11})/);
            if (looseMatch && looseMatch[1] && looseMatch[1].length === 11) {
                return looseMatch[1];
            }
            return null;
        }

        async function fetchVideoData(videoId) {
            const oembedUrl = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`;
            try {
                const response = await fetch(oembedUrl);
                if (!response.ok) throw new Error(`Erro oEmbed: ${response.status}`);
                const data = await response.json();
                return {
                    title: data.title || 'Título não disponível',
                    videoUrl: `https://www.youtube.com/watch?v=${videoId}`,
                    channelName: data.author_name || 'Canal não disponível'
                };
            } catch (error) {
                console.warn('Erro oEmbed, tentando fallback...', error);
                return await fetchVideoDataFallback(videoId);
            }
        }

        async function fetchVideoDataFallback(videoId) {
            try {
                const pageUrl = `https://www.youtube.com/watch?v=${videoId}`;
                const response = await fetch(pageUrl);
                if (!response.ok) throw new Error(`Erro na página: ${response.status}`);
                const html = await response.text();

                let title = 'Título não disponível';
                const titleMatch = html.match(/<title>(.*?)<\/title>/i);
                if (titleMatch && titleMatch[1]) {
                    title = titleMatch[1].replace(/\s*[-–]\s*YouTube\s*$/i, '').trim();
                }

                let channelName = 'Canal não disponível';
                const channelMatch = html.match(/"author":"([^"]+)"/i);
                if (channelMatch && channelMatch[1]) {
                    channelName = channelMatch[1];
                } else {
                    const ownerMatch = html.match(/"owner":{"name":"([^"]+)"/i);
                    if (ownerMatch && ownerMatch[1]) channelName = ownerMatch[1];
                }

                return {
                    title: title,
                    videoUrl: pageUrl,
                    channelName: channelName
                };
            } catch (error) {
                console.error('Fallback error:', error);
                throw new Error('Não foi possível extrair dados automaticamente.');
            }
        }

        // Listener para detectar quando o link é preenchido
        document.getElementById('input-link').addEventListener('input', async function(e) {
            const url = e.target.value.trim();
            const videoId = extractVideoId(url);
            
            if (videoId) {
                const inputAssunto = document.getElementById('input-assunto');
                const inputTexto = document.getElementById('input-texto');
                const statusLabel = document.getElementById('youtube-status');

                // Muda o visual indicando o carregamento
                statusLabel.textContent = "⏳ Buscando informações do YouTube...";
                statusLabel.style.color = "#d35400";
                statusLabel.style.display = "block";
                inputAssunto.classList.add('loading-input');
                inputTexto.classList.add('loading-input');
                inputAssunto.value = "Carregando título...";
                inputTexto.value = "Carregando canal...";

                try {
                    const data = await fetchVideoData(videoId);
                    
                    // Preenche os inputs com o resultado da API do YouTube
                    inputAssunto.value = data.title;
                    inputTexto.value = data.channelName;
                    
                    // Opcional: padroniza a URL salva no formato limpo do watch?v=
                    e.target.value = data.videoUrl;

                    statusLabel.textContent = "✅ Dados do YouTube extraídos com sucesso!";
                    statusLabel.style.color = "#27ae60";
                } catch (error) {
                    console.error(error);
                    statusLabel.textContent = "❌ Falha ao extrair dados do vídeo automaticamente.";
                    statusLabel.style.color = "#c0392b";
                    inputAssunto.value = "";
                    inputTexto.value = "";
                } finally {
                    inputAssunto.classList.remove('loading-input');
                    inputTexto.classList.remove('loading-input');
                }
            }
        });

        // ==========================================

        // Salva registro (Novo ou Editado)
        function saveRecord() {
            const assunto = document.getElementById('input-assunto').value.replace(/;/g, ' ').trim();
            const link = document.getElementById('input-link').value.replace(/;/g, ' ').trim();
            const texto = document.getElementById('input-texto').value.replace(/;/g, ' ').trim();
            const editIndex = document.getElementById('edit-index').value;

            if (!assunto) return alert('O campo Assunto é obrigatório!');

            if (editIndex === "") {
                // ADICIONAR NOVO
                const agora = new Date();
                const datahora = agora.getFullYear() + '-' + 
                    String(agora.getMonth()+1).padStart(2, '0') + '-' + 
                    String(agora.getDate()).padStart(2, '0') + '-' + 
                    String(agora.getHours()).padStart(2, '0') + '-' + 
                    String(agora.getMinutes()).padStart(2, '0') + '-' + 
                    String(agora.getSeconds()).padStart(2, '0');

                csvDataGlobal.push({ datahora, assunto, link, texto });
            } else {
                // SALVAR ALTERAÇÃO
                csvDataGlobal[editIndex].assunto = assunto;
                csvDataGlobal[editIndex].link = link;
                csvDataGlobal[editIndex].texto = texto;
            }

            pushToGitHub();
        }

        function editRow(index) {
            const item = csvDataGlobal[index];
            document.getElementById('form-title').textContent = "✏️ Editar Registro";
            document.getElementById('input-assunto').value = item.assunto;
            document.getElementById('input-link').value = item.link;
            document.getElementById('input-texto').value = item.texto;
            document.getElementById('edit-index').value = index;
            document.getElementById('btn-save').textContent = "Salvar Alterações";
            document.getElementById('btn-cancel').style.display = 'inline-block';
            document.getElementById('youtube-status').style.display = 'none';
        }

        function deleteRow(index) {
            if (confirm('Tem certeza que deseja excluir esta linha?')) {
                csvDataGlobal.splice(index, 1);
                pushToGitHub();
            }
        }

        function resetForm() {
            document.getElementById('form-title').textContent = "➕ Adicionar Novo Registro";
            document.getElementById('input-assunto').value = '';
            document.getElementById('input-link').value = '';
            document.getElementById('input-texto').value = '';
            document.getElementById('edit-index').value = '';
            document.getElementById('btn-save').textContent = "Adicionar";
            document.getElementById('btn-cancel').style.display = 'none';
            document.getElementById('youtube-status').style.display = 'none';
        }

        // Transforma o array de volta para texto CSV e envia para o GitHub via API
        async function pushToGitHub() {
            const user = localStorage.getItem('git_user');
            const token = localStorage.getItem('git_token');

            if (!user || !token) return alert('Usuário ou Token não configurados!');

            let csvContent = "datahora;assunto;link;texto_complementar\n";
            csvDataGlobal.forEach(item => {
                csvContent += `${item.datahora};${item.assunto};${item.link};${item.texto}\n`;
            });

            const url = `https://api.github.com/repos/${user}/${repoName}/contents/${csvFileName}`;

            try {
                const getFile = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!getFile.ok) throw new Error('Erro ao obter o SHA do arquivo. Verifique seu usuário e repositório.');
                const fileData = await getFile.json();
                const sha = fileData.sha;

                const base64Content = btoa(unescape(encodeURIComponent(csvContent)));

                const updateFile = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Atualização automática via painel web",
                        content: base64Content,
                        sha: sha
                    })
                });

                if (updateFile.ok) {
                    alert('Sucesso! O CSV foi atualizado no GitHub. Aguarde cerca de 1 minuto para o GitHub Pages atualizar.');
                    resetForm();
                    renderTable();
                } else {
                    throw new Error('Falha ao enviar arquivo para o GitHub.');
                }

            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }

        function formatDateTime(raw) {
            if (!raw || raw.length < 16) return raw;
            const parts = raw.split('-');
            return parts.length >= 5 ? `${parts[2]}/${parts[1]}/${parts[0]} às ${parts[3]}:${parts[4]}` : raw;
        }

        // Filtro de busca
        document.getElementById('search').addEventListener('keyup', function() {
            const value = this.value.toLowerCase();
            document.querySelectorAll('#csv-table tbody tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(value) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
